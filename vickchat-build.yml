name: Build VickChat Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "VickChat_Flutter_Starter.zip"
      - ".github/workflows/vickchat-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract VickChat starter
        run: |
          unzip -o VickChat_Flutter_Starter.zip -d starter
          cp -R starter/vickchat_flutter/. .

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name vickchat .

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vickchat-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
